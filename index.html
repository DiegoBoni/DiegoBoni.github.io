<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard de Conversaciones</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Set Tailwind to use the 'class' strategy for dark mode
    tailwind.config = {
      darkMode: 'class'
    }
  </script>
  <style>
    /* Custom scrollbars */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f1f1; /* Light mode track */
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb {
      background: #888; /* Light mode thumb */
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #555; /* Light mode thumb hover */
    }

    /* Dark mode scrollbars */
    html.dark ::-webkit-scrollbar-track {
      background: #1e293b; /* e.g., slate-800 */
    }
    html.dark ::-webkit-scrollbar-thumb {
      background: #475569; /* e.g., slate-600 */
    }
    html.dark ::-webkit-scrollbar-thumb:hover {
      background: #64748b; /* e.g., slate-500 */
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.1.0/",
    "react": "https://esm.sh/react@^19.1.0",
    "react/": "https://esm.sh/react@^19.1.0/",
    "lucide-react": "https://esm.sh/lucide-react@^0.516.0",
    "recharts": "https://esm.sh/recharts@^2.15.3"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="min-h-screen
             text-slate-800
             bg-gradient-to-br from-indigo-100 via-purple-50 to-pink-100
             dark:bg-gradient-to-br dark:from-slate-900 dark:via-purple-950 dark:to-indigo-950
             dark:text-slate-200
             transition-colors duration-300 ease-in-out">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
