<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Conversaciones</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }

        .controls {
            padding: 30px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
        }

        .input-group {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .input-container {
            flex: 1;
            min-width: 300px;
        }

        .input-container label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #374151;
        }

        .input-container input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .input-container input:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 120px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(79, 70, 229, 0.3);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }

        .spinner {
            border: 4px solid #f3f4f6;
            border-top: 4px solid #4f46e5;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .dashboard {
            padding: 30px;
            display: none;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            border-left: 4px solid #4f46e5;
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-card h3 {
            color: #374151;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }

        .stat-card .value {
            font-size: 2rem;
            font-weight: 700;
            color: #4f46e5;
        }

        .sessions-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .sessions-header {
            background: #f8fafc;
            padding: 20px;
            border-bottom: 1px solid #e2e8f0;
        }

        .sessions-header h2 {
            color: #374151;
            font-size: 1.5rem;
        }

        .session {
            padding: 20px;
            border-bottom: 1px solid #f1f5f9;
            transition: background-color 0.3s ease;
        }

        .session:hover {
            background-color: #f8fafc;
        }

        .session:last-child {
            border-bottom: none;
        }

        .session-header {
            display: flex;
            justify-content: between;
            align-items: center;
            margin-bottom: 15px;
            cursor: pointer;
        }

        .session-id {
            font-family: 'Courier New', monospace;
            background: #e0e7ff;
            color: #3730a3;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.85rem;
        }

        .session-meta {
            display: flex;
            gap: 20px;
            font-size: 0.9rem;
            color: #6b7280;
            margin-bottom: 10px;
        }

        .messages {
            display: none;
            max-height: 400px;
            overflow-y: auto;
        }

        .message {
            margin: 10px 0;
            padding: 12px;
            border-radius: 10px;
            max-width: 80%;
        }

        .message.user {
            background: #eff6ff;
            border: 1px solid #dbeafe;
            margin-left: auto;
            text-align: right;
        }

        .message.assistant {
            background: #f3f4f6;
            border: 1px solid #e5e7eb;
        }

        .message-time {
            font-size: 0.8rem;
            color: #9ca3af;
            margin-top: 5px;
        }

        .error {
            background: #fef2f2;
            color: #dc2626;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 30px;
            border-left: 4px solid #dc2626;
        }

        .toggle-btn {
            background: none;
            border: none;
            color: #4f46e5;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .toggle-btn:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Dashboard de Conversaciones</h1>
            <p>Visualiza y analiza el historial de chats</p>
        </div>

        <div class="controls">
            <div class="input-group">
                <div class="input-container">
                    <label for="binId">ID del Cliente</label>
                    <input type="text" id="binId" placeholder="Ingresa el Bin ID del cliente">
                </div>
                <button class="btn" onclick="loadData()">Cargar Dashboard</button>
            </div>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Cargando datos del dashboard...</p>
        </div>

        <div class="dashboard" id="dashboard">
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Total de Sesiones</h3>
                    <div class="value" id="totalSessions">0</div>
                </div>
                <div class="stat-card">
                    <h3>Total de Mensajes</h3>
                    <div class="value" id="totalMessages">0</div>
                </div>
                <div class="stat-card">
                    <h3>Última Actualización</h3>
                    <div class="value" id="lastUpdated">-</div>
                </div>
                <div class="stat-card">
                    <h3>Versión de Datos</h3>
                    <div class="value" id="dataVersion">-</div>
                </div>
            </div>

            <div class="sessions-container">
                <div class="sessions-header">
                    <h2>Historial de Conversaciones</h2>
                </div>
                <div id="sessionsContainer"></div>
            </div>
        </div>
    </div>

    <script>
        // Aquí debes poner tu X-MASTER-KEY de JSONBin
        const MASTER_KEY = '$2a$10$aFvQlWWiKdpJ0OoQubC.aeQEFhXSbgbE.U3CIQZ1yM96pVe52LCPW';
        
        async function loadData() {
            const binId = document.getElementById('binId').value.trim();
            
            if (!binId) {
                alert('Por favor ingresa un Bin ID válido');
                return;
            }

            // Mostrar loading
            document.getElementById('loading').style.display = 'block';
            document.getElementById('dashboard').style.display = 'none';
            
            // Limpiar errores previos
            const existingError = document.querySelector('.error');
            if (existingError) {
                existingError.remove();
            }

            try {
                const response = await fetch(`https://api.jsonbin.io/v3/b/${binId}`, {
                    method: 'GET',
                    headers: {
                        'X-Master-Key': MASTER_KEY,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error(`Error ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                displayDashboard(data.record);

            } catch (error) {
                console.error('Error:', error);
                showError(`Error al cargar los datos: ${error.message}`);
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function displayDashboard(data) {
            // Actualizar estadísticas
            document.getElementById('totalSessions').textContent = data.metadata?.totalSessions || data.chatHistory.length;
            
            const totalMessages = data.chatHistory.reduce((total, session) => total + (session.totalMessages || session.messages.length), 0);
            document.getElementById('totalMessages').textContent = totalMessages;
            
            document.getElementById('lastUpdated').textContent = formatDate(data.metadata?.lastUpdated);
            document.getElementById('dataVersion').textContent = data.metadata?.version || '1.0';

            // Mostrar sesiones
            const sessionsContainer = document.getElementById('sessionsContainer');
            sessionsContainer.innerHTML = '';

            data.chatHistory.forEach((session, index) => {
                if (session.messages && session.messages.length > 0) {
                    const sessionElement = createSessionElement(session, index);
                    sessionsContainer.appendChild(sessionElement);
                }
            });

            document.getElementById('dashboard').style.display = 'block';
        }

        function createSessionElement(session, index) {
            const sessionDiv = document.createElement('div');
            sessionDiv.className = 'session';

            const sessionId = session.sessionId || `session-${index}`;
            const startDate = formatDate(session.conversationStarted);
            const lastUpdate = formatDate(session.lastUpdated);
            const messageCount = session.totalMessages || session.messages.length;

            sessionDiv.innerHTML = `
                <div class="session-header" onclick="toggleMessages('messages-${index}')">
                    <div>
                        <div class="session-id">${sessionId}</div>
                        <div class="session-meta">
                            <span>📅 Iniciada: ${startDate}</span>
                            <span>🔄 Actualizada: ${lastUpdate}</span>
                            <span>💬 ${messageCount} mensajes</span>
                        </div>
                    </div>
                    <button class="toggle-btn" id="toggle-${index}">Ver Mensajes ▼</button>
                </div>
                <div class="messages" id="messages-${index}">
                    ${session.messages.map(message => createMessageElement(message)).join('')}
                </div>
            `;

            return sessionDiv;
        }

        function createMessageElement(message) {
            if (!message.content) return '';
            
            const time = formatTime(message.timestamp);
            const role = message.role === 'user' ? 'user' : 'assistant';
            const emoji = role === 'user' ? '👤' : '🤖';
            
            return `
                <div class="message ${role}">
                    <strong>${emoji} ${role === 'user' ? 'Usuario' : 'Asistente'}:</strong>
                    <div>${message.content}</div>
                    <div class="message-time">${time}</div>
                </div>
            `;
        }

        function toggleMessages(messagesId) {
            const messagesDiv = document.getElementById(messagesId);
            const toggleBtn = document.getElementById(`toggle-${messagesId.split('-')[1]}`);
            
            if (messagesDiv.style.display === 'none' || messagesDiv.style.display === '') {
                messagesDiv.style.display = 'block';
                toggleBtn.textContent = 'Ocultar Mensajes ▲';
            } else {
                messagesDiv.style.display = 'none';
                toggleBtn.textContent = 'Ver Mensajes ▼';
            }
        }

        function formatDate(dateString) {
            if (!dateString) return '-';
            try {
                const date = new Date(dateString);
                return date.toLocaleDateString('es-ES', {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric'
                });
            } catch {
                return dateString;
            }
        }

        function formatTime(dateString) {
            if (!dateString) return '-';
            try {
                const date = new Date(dateString);
                return date.toLocaleString('es-ES', {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            } catch {
                return dateString;
            }
        }

        function showError(message) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error';
            errorDiv.innerHTML = `
                <strong>⚠️ Error:</strong> ${message}
                <p>Verifica que el Bin ID sea correcto y que tengas permisos para acceder a los datos.</p>
            `;
            
            document.querySelector('.container').appendChild(errorDiv);
        }

        // Permitir cargar con Enter
        document.getElementById('binId').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                loadData();
            }
        });
    </script>
</body>
</html>
